<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2600c" />
    <meta name="description" content="SAMSBPM Trading Agent — AI-powered stock signal analysis" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="SAMSBPM Trading Agent" />
    <meta property="og:description" content="AI-powered stock signal analysis by SAMSBPM Technologies Inc" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Google Fonts: Work Sans + Archivo + Fraunces (headings) + Plus Jakarta Sans (logo, matches samsbpm.ca) -->
    <!-- Non-blocking font load: preconnect + media trick defers stylesheet until after render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,500&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,500&family=Work+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>SAMSBPM — Trading Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
