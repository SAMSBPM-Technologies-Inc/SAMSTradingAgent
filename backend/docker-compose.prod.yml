services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_agent_api
    restart: unless-stopped
    # No host port binding — cloudflared reaches the API via internal Docker network
    expose:
      - "8000"
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal

  mongo:
    image: mongo:7
    container_name: trading_mongo
    restart: unless-stopped
    # Port NOT exposed to host — internal access only
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: trading_agent
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: trading_cloudflared
    restart: unless-stopped
    # TUNNEL_TOKEN comes from .env.production (set in Cloudflare dashboard)
    # Service URL in Cloudflare dashboard should be: http://api:8000
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mongo_data:
