services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_agent_api
    restart: unless-stopped
    # No host port binding — cloudflared reaches the API via internal Docker network
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: trading_cloudflared
    restart: unless-stopped
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml
    env_file:
      - .env.production
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

