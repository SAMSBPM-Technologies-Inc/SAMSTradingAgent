services:
  # ── Interactive Brokers Gateway (headless) ──────────────────────────────────
  # Runs IB Gateway in a Docker container using IBC for automatic login.
  # Live trading port 4001 is exposed only on the internal network.
  # Credentials: set TWS_USERID, TWS_PASSWORD, TRADING_MODE in .env.production
  ibgateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: trading_ibgateway
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - READ_ONLY_API=false
    volumes:
      - ibgateway_settings:/home/ibgateway/Jts    # persists IB Gateway preferences
      - ibgateway_logs:/home/ibgateway/IBController/Logs
    # Only expose API port on the internal network — never to the host
    expose:
      - "4001"   # live trading API (used when IB_TRADING_MODE=live)
      - "4002"   # paper trading API (used when IB_TRADING_MODE=paper)
    healthcheck:
      # Check the API port is accepting connections (IB Gateway takes ~90s to boot)
      test: ["CMD-SHELL", "nc -z localhost ${IBKR_PORT:-4002} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_agent_api
    restart: unless-stopped
    # No host port binding — cloudflared reaches the API via internal Docker network
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      # Point IBKR client to the ibgateway container on the internal network.
      # These override any values in .env.production for Docker deployments.
      - IBKR_HOST=ibgateway
      - IBKR_PORT=${IBKR_PORT:-4002}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: trading_cloudflared
    restart: unless-stopped
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml
    env_file:
      - .env.production
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  ibgateway_settings:    # IB Gateway preferences — survives container restarts
  ibgateway_logs:

