services:
  # ── Interactive Brokers Gateway (headless) ──────────────────────────────────
  # Runs IB Gateway in a Docker container using IBC for automatic login.
  #
  # PORT MODEL — read before changing anything here:
  #   IB Gateway itself binds its API to 127.0.0.1 ONLY, inside this container:
  #       127.0.0.1:4001 = live      127.0.0.1:4002 = paper
  #   Those are unreachable from any other container. The image therefore runs
  #   socat to republish them on all interfaces under DIFFERENT port numbers:
  #       0.0.0.0:4003   = live      0.0.0.0:4004   = paper
  #   So the api container MUST connect to ibgateway:4003 / ibgateway:4004.
  #   Connecting to 4001/4002 is refused and is the classic silent failure here.
  #
  # Credentials come from .env.production: TWS_USERID, TWS_PASSWORD, TRADING_MODE.
  # Filtered Docker API, so the "Restart gateway" button in the UI does not
  # require handing the api container the raw host socket.
  #
  # WHAT THIS DOES AND DOES NOT GRANT — read before assuming it is harmless.
  #
  # The raw socket is root on the host: images, volumes, networks, exec into any
  # container, and creating privileged ones. This proxy answers only the
  # /containers endpoints and only because POST=1 is set, so image, volume,
  # network, swarm and system endpoints are refused outright. That is a large
  # reduction, and it is NOT a precise "restart only" capability: POST=1 also
  # permits other container verbs. It is a much smaller blast radius than the
  # socket, not zero.
  #
  # The proxy is on an isolated network with the api and is never published to
  # the host. If you would rather grant nothing at all, delete this service, set
  # ALLOW_GATEWAY_RESTART=false, and recover over SSH — the runbook covers it.
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:0.3.0
    container_name: trading_dockerproxy
    restart: unless-stopped
    environment:
      # Allow: container endpoints, and the POST verb they need.
      - CONTAINERS=1
      - POST=1
      # Refuse everything else explicitly rather than relying on defaults.
      - IMAGES=0
      - VOLUMES=0
      - NETWORKS=0
      - EXEC=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - SECRETS=0
      - SERVICES=0
      - SWARM=0
      - NODES=0
      - TASKS=0
      - PLUGINS=0
      - SYSTEM=0
      - INFO=0
      - AUTH=0
      - DISTRIBUTION=0
      - SESSION=0
    volumes:
      # Read-only: the proxy reads the socket, the api never touches it.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - internal

  ibgateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: trading_ibgateway
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # IBC expects yes/no here, NOT true/false. Passing "false" left the
      # setting undefined, so IB Gateway kept its persisted default of
      # read-only and rejected every order with:
      #   code 321 "The API interface is currently in Read-Only mode."
      # The socket still connects and market data flows, so this looks like a
      # working integration right up until the first order is submitted.
      - READ_ONLY_API=no
      # Suppress the "order submitted without market data" confirmation dialog.
      # Without a live data subscription for a symbol, IB otherwise blocks the
      # order behind a modal no headless gateway can answer.
      - ALLOW_BLIND_TRADING=yes
      - EXISTING_SESSION_DETECTED_ACTION=primary
      - ACCEPT_INCOMING_CONNECTION_ACTION=accept
      - DISMISS_PASSWORD_EXPIRY_WARNING=yes
      # IBKR force-logs-off every session daily. Schedule the restart well after
      # the US close and before pre-market, so it never lands mid-session.
      # Override with IB_AUTO_RESTART_TIME in .env.production.
      - AUTO_RESTART_TIME=${IB_AUTO_RESTART_TIME:-11:45 PM}
      - TIME_ZONE=${IB_TIME_ZONE:-America/New_York}
      # If a 2FA push is never answered, restart and retry rather than dying.
      - TWOFA_TIMEOUT_ACTION=restart
    volumes:
      - ibgateway_settings:/home/ibgateway/Jts    # persists IB Gateway preferences
      - ibgateway_logs:/home/ibgateway/IBController/Logs
    # Reachable only on the internal Docker network — never published to the host.
    expose:
      - "4003"   # live  API via socat relay (IBKR_PORT=4003)
      - "4004"   # paper API via socat relay (IBKR_PORT=4004)
    healthcheck:
      # Probe the SOCAT RELAY port (4004/4003), not IB Gateway's own port.
      # An earlier check (`nc -z localhost 4002`) passed from inside this
      # container even when every cross-container connection was refused.
      # socat binds 0.0.0.0, so if loopback answers on the relay port the relay
      # is up and other containers can reach it too.
      #
      # Uses bash's /dev/tcp rather than nc: this image ships neither nc nor
      # ncat nor python, so every nc-based check failed with
      # "/bin/sh: 1: nc: not found" and reported the container permanently
      # unhealthy while it was in fact serving. bash must be invoked explicitly
      # because /bin/sh here is dash, which has no /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${IBKR_PORT:-4004}"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s   # IB Gateway + IBC login takes ~90-120s
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_agent_api
    restart: unless-stopped
    # No host port binding — cloudflared reaches the API via internal Docker network
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      # Point IBKR client to the ibgateway container on the internal network.
      # These override any values in .env.production for Docker deployments.
      # 4004 = paper relay, 4003 = live relay. See the port model note above —
      # 4001/4002 are loopback-only inside ibgateway and will always refuse.
      - IBKR_HOST=ibgateway
      - IBKR_PORT=${IBKR_PORT:-4004}
      # Lets the UI's "Restart gateway" button work. Requires the Docker socket
      # mount below — the flag alone does nothing. Off by default; see
      # runbooks/ib-gateway-offline.md for the trade being made.
      - ALLOW_GATEWAY_RESTART=${ALLOW_GATEWAY_RESTART:-false}
      # The api never sees the real Docker socket — it talks to the filtered
      # proxy below. See the dockerproxy service for what that does and does
      # not allow.
      - DOCKER_PROXY_URL=${DOCKER_PROXY_URL:-http://dockerproxy:2375}
    depends_on:
      # Start ordering only — the api must come up even if the gateway is still
      # booting or failing, since it also serves the dashboard. broker.py's
      # reconnect loop handles a gateway that arrives late.
      ibgateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: trading_cloudflared
    restart: unless-stopped
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml
    env_file:
      - .env.production
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  ibgateway_settings:    # IB Gateway preferences — survives container restarts
  ibgateway_logs:

