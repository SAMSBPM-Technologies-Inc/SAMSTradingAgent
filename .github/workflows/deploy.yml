name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Two pushes in quick succession previously produced two deploys racing over the
# same containers on the box — one removed trading_agent_api while the other was
# starting it ("container is marked for removal and cannot be started"), and the
# run that finished last decided the final state. Serialise instead.
# cancel-in-progress stays false: killing a deploy mid-run can leave the host
# with a stopped api container.
concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # REQUIRED: the TWS_* secrets and the TRADING_MODE / AUTO_TRADE_* variables
    # are scoped to the "Production" environment. GitHub only exposes
    # environment-scoped secrets to a job that declares the environment —
    # without this line every secrets.* and vars.* lookup below silently
    # resolves to an empty string and the gateway is skipped.
    environment: Production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          # IB Gateway login — required for the ibgateway container to authenticate.
          # Without these IBC exits at startup and nothing listens on the API port.
          # IBKR issues SEPARATE credentials for paper and live; the deploy script
          # picks the pair matching TRADING_MODE and writes it as TWS_USERID/
          # TWS_PASSWORD, which are the env var names the gateway image expects.
          TWS_USERID_PAPER: ${{ secrets.TWS_USERID_PAPER }}
          TWS_PASSWORD_PAPER: ${{ secrets.TWS_PASSWORD_PAPER }}
          TWS_USERID: ${{ secrets.TWS_USERID }}
          TWS_PASSWORD: ${{ secrets.TWS_PASSWORD }}
          # "paper" or "live". Selects BOTH the credential pair and the socat
          # relay port. Defaults to paper — the safe direction to fail.
          TRADING_MODE: ${{ vars.TRADING_MODE || 'paper' }}
          # Master kill-switch. Must be "true" or the app never even attempts a
          # broker connection (see main.py lifespan / pipeline._execute_trades).
          AUTO_TRADE_ENABLED: ${{ vars.AUTO_TRADE_ENABLED || 'false' }}
          # Second, independent gate. Must ALSO be "true" for real-money orders:
          # without it PUT /trading/settings rejects paper_trading=false with 403.
          # TRADING_MODE=live alone is not sufficient.
          AUTO_TRADE_LIVE_ALLOWED: ${{ vars.AUTO_TRADE_LIVE_ALLOWED || 'false' }}
          # Which IBKR account to trade. REQUIRED when the login manages more
          # than one account (e.g. an individual account plus a registered one):
          # without it the adapter refuses to size positions or submit orders
          # rather than let IB pick an account for us.
          IBKR_ACCOUNT_ID: ${{ vars.IBKR_ACCOUNT_ID }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: CLOUDFLARE_TUNNEL_TOKEN,ENCRYPTION_KEY,TWS_USERID,TWS_PASSWORD,TWS_USERID_PAPER,TWS_PASSWORD_PAPER,TRADING_MODE,AUTO_TRADE_ENABLED,AUTO_TRADE_LIVE_ALLOWED,IBKR_ACCOUNT_ID
          command_timeout: 30m
          script: |
            set -e
            cd /opt/trading-agent
            git pull origin main
            cd backend

            # Ensure env vars exist and are non-empty in .env.production.
            # Appends if the key is absent; overwrites if the key exists with an empty value.
            # This prevents pydantic from receiving "" and failing to parse bool/int/float.
            ENV=/opt/trading-agent/backend/.env.production
            set_if_missing_or_empty() {
              local key="$1" value="$2"
              if grep -q "^${key}=$" "$ENV" 2>/dev/null; then
                sed -i "s|^${key}=$|${key}=${value}|" "$ENV"
              elif ! grep -q "^${key}=" "$ENV" 2>/dev/null; then
                echo "${key}=${value}" >> "$ENV"
              fi
            }
            # Always overwrite secrets from GitHub Secrets (never leave stale/empty values)
            inject_secret() {
              local key="$1" value="$2"
              if grep -q "^${key}=" "$ENV" 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${value}|" "$ENV"
              else
                echo "${key}=${value}" >> "$ENV"
              fi
            }
            inject_secret CLOUDFLARE_TUNNEL_TOKEN "$CLOUDFLARE_TUNNEL_TOKEN"
            inject_secret ENCRYPTION_KEY          "$ENCRYPTION_KEY"

            # ── IB Gateway credentials + mode ─────────────────────────────────
            # Credentials were previously never written to .env.production, so
            # the ibgateway container had no login and IBC exited immediately.
            #
            # Credential pair AND relay port are chosen in ONE branch so they can
            # never disagree — pointing live credentials at the paper port (or
            # vice versa) fails in confusing ways.
            #   paper -> TWS_USERID_PAPER / TWS_PASSWORD_PAPER, port 4004
            #   live  -> TWS_USERID       / TWS_PASSWORD,       port 4003
            # 4003/4004 are the socat relay ports. IB Gateway's own 4001/4002 are
            # bound to 127.0.0.1 inside the gateway container and are unreachable
            # from the api container.
            if [ "$TRADING_MODE" = "live" ]; then
              IB_USER="$TWS_USERID"
              IB_PASS="$TWS_PASSWORD"
              IB_PORT=4003
              echo "════════════════════════════════════════════════════════════"
              echo "⚠️  TRADING_MODE=live — orders will hit the REAL account."
              echo "    AUTO_TRADE_ENABLED     = ${AUTO_TRADE_ENABLED:-false}"
              echo "    AUTO_TRADE_LIVE_ALLOWED= ${AUTO_TRADE_LIVE_ALLOWED:-false}"
              echo "    IBKR_ACCOUNT_ID        = ${IBKR_ACCOUNT_ID:-<unset>}"
              echo "    Real orders require BOTH flags true AND each user's"
              echo "    auto_trade_settings.paper_trading=false."
              echo "    IBKR_ACCOUNT_ID must be set when the login manages more"
              echo "    than one account, or orders and sizing are refused."
              if [ -z "$IBKR_ACCOUNT_ID" ]; then
                echo "    ⚠️  IBKR_ACCOUNT_ID is UNSET — trading will fail closed."
              fi
              echo "════════════════════════════════════════════════════════════"
            else
              IB_USER="$TWS_USERID_PAPER"
              IB_PASS="$TWS_PASSWORD_PAPER"
              IB_PORT=4004
              echo "TRADING_MODE=paper — using paper credentials, relay port 4004."
            fi

            inject_secret TWS_USERID   "$IB_USER"
            inject_secret TWS_PASSWORD "$IB_PASS"
            inject_secret IBKR_PORT    "$IB_PORT"
            inject_secret TRADING_MODE "$TRADING_MODE"
            inject_secret AUTO_TRADE_ENABLED "$AUTO_TRADE_ENABLED"
            inject_secret IBKR_ACCOUNT_ID   "$IBKR_ACCOUNT_ID"

            set_if_missing_or_empty MONGODB_DB_NAME                trading_agent
            inject_secret           CORS_ORIGINS                   https://sta.samsbpm.com,https://samtrades.samsbpm.com
            set_if_missing_or_empty ANALYST_MODEL                  claude-opus-4-6
            set_if_missing_or_empty ANALYST_EXTENDED_THINKING      true
            set_if_missing_or_empty ANALYST_CACHE_MINUTES          60
            set_if_missing_or_empty ANALYST_PRICE_CHANGE_PCT       0.03
            set_if_missing_or_empty ANALYST_SCORE_CHANGE_THRESHOLD 0.12
            set_if_missing_or_empty ANALYST_VIX_SPIKE_THRESHOLD    30.0
            # AUTO_TRADE_ENABLED / IBKR_PORT are injected above (not set_if_missing).
            # set_if_missing_or_empty only fills blanks, so the old `false` written
            # on the first deploy could never be flipped on by a later deploy.
            # IBKR_HOST is set by docker-compose (=ibgateway) and needs no default here.
            # Injected, not set_if_missing: the latter wrote `false` on the first
            # deploy and could never flip it afterwards, so live trading stayed
            # blocked at the API layer (403 on paper_trading=false) no matter what
            # TRADING_MODE said. Same defect that kept AUTO_TRADE_ENABLED pinned off.
            inject_secret AUTO_TRADE_LIVE_ALLOWED "$AUTO_TRADE_LIVE_ALLOWED"
            set_if_missing_or_empty IBKR_CLIENT_ID                 1
            set_if_missing_or_empty ENABLE_ML_MODEL                false
            set_if_missing_or_empty ENABLE_BACKTESTING             false
            set_if_missing_or_empty ENABLE_AI_ANALYST              true
            set_if_missing_or_empty INGESTION_INTERVAL_MINUTES     5
            set_if_missing_or_empty WEIGHT_TECHNICAL               0.25
            set_if_missing_or_empty WEIGHT_FUNDAMENTAL             0.15
            set_if_missing_or_empty WEIGHT_SENTIMENT               0.20
            set_if_missing_or_empty WEIGHT_MACRO                   0.15
            set_if_missing_or_empty WEIGHT_VOLATILITY              0.10
            set_if_missing_or_empty WEIGHT_CATALYST                0.15

            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.production"

            $COMPOSE build api

            # ── IB Gateway ────────────────────────────────────────────────────
            # This service was previously NEVER started by this workflow (every
            # `up` used --no-deps and named only api/cloudflared), so unless it
            # had been launched by hand on the box there was no gateway at all.
            # Checks the credentials actually selected for this mode, not the
            # live pair — otherwise a paper deploy with only paper secrets set
            # would skip the gateway.
            GATEWAY_STARTED=0
            if [ -n "$IB_USER" ] && [ -n "$IB_PASS" ]; then
              echo "=== starting ibgateway (mode=$TRADING_MODE, port=$IB_PORT) ==="
              $COMPOSE up -d --no-deps ibgateway
              GATEWAY_STARTED=1
            else
              if [ "$TRADING_MODE" = "live" ]; then
                echo "WARNING: TWS_USERID/TWS_PASSWORD not set — skipping ibgateway."
              else
                echo "WARNING: TWS_USERID_PAPER/TWS_PASSWORD_PAPER not set — skipping ibgateway."
              fi
              echo "         Auto-trading will stay disconnected until they are configured."
            fi

            # Start api alone first so we can capture its logs if it crashes
            $COMPOSE up -d --no-deps api
            sleep 25

            # Always show api logs before checking health (helps diagnose crashes)
            echo "=== api logs ==="
            $COMPOSE logs --tail=50 api

            # Verify api is running before starting cloudflared
            $COMPOSE ps api
            docker inspect --format='{{.State.Status}} {{.State.Health.Status}}' trading_agent_api

            $COMPOSE up -d --no-deps cloudflared
            sleep 5
            $COMPOSE ps

            # ── IB Gateway login diagnostics ──────────────────────────────────
            # IBC's own output is the only place a failed login is visible —
            # notably a live 2FA push that nobody answered, which otherwise just
            # looks like a gateway that never starts serving.
            if [ "$GATEWAY_STARTED" = "1" ]; then
              echo "=== waiting for IBC login (~120s) ==="
              sleep 90
              echo "=== ibgateway logs ==="
              $COMPOSE logs --tail=60 ibgateway 2>&1 \
                | grep -viE 'password|userid|username' || true
              echo "=== ibgateway container state ==="
              docker inspect --format='{{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' trading_ibgateway || true
            fi

            # ── Broker reachability probe ─────────────────────────────────────
            # Proves the api container can actually open a socket to the gateway
            # relay port. Runs whenever the gateway was started — not only when
            # auto-trading is armed — since it is the cheapest proof that the
            # port/credentials/mode combination is right.
            # Non-fatal: IB Gateway needs ~120s to finish IBC login.
            if [ "$GATEWAY_STARTED" = "1" ]; then
              echo "=== IBKR reachability (api -> ibgateway:${TRADING_MODE}) ==="
              # Keep this a single line — a multi-line -c would break the YAML block scalar.
              # The api image is python:3.12-slim and has no nc, so use socket directly.
              if docker exec trading_agent_api python -c "import os,socket; socket.create_connection((os.getenv('IBKR_HOST','ibgateway'), int(os.getenv('IBKR_PORT','4004'))), 5).close()"; then
                echo "OK: api reached the IB Gateway relay port"
              else
                echo "NOT READY: api cannot reach the gateway relay port yet."
                echo "  Expected if the deploy just ran (IBC login takes ~120s) — broker.py retries."
                echo "  If it persists: docker compose -f docker-compose.prod.yml logs ibgateway"
              fi
            fi
