name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/trading-agent
            git pull origin main
            cd backend

            # Append any new env vars that don't exist yet in .env.production.
            # Safe to run on every deploy — grep -q skips lines already present.
            ENV=/opt/trading-agent/backend/.env.production
            append_if_missing() {
              local key="$1" value="$2"
              grep -q "^${key}=" "$ENV" || echo "${key}=${value}" >> "$ENV"
            }
            append_if_missing ANALYST_MODEL            claude-opus-4-6
            append_if_missing ANALYST_EXTENDED_THINKING true
            append_if_missing ANALYST_CACHE_MINUTES     60
            append_if_missing ANALYST_PRICE_CHANGE_PCT  0.03
            append_if_missing ANALYST_SCORE_CHANGE_THRESHOLD 0.12
            append_if_missing ANALYST_VIX_SPIKE_THRESHOLD    30.0
            append_if_missing AUTO_TRADE_ENABLED         false
            append_if_missing AUTO_TRADE_LIVE_ALLOWED    false

            docker compose -f docker-compose.prod.yml --env-file .env.production build api
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-deps api cloudflared
            sleep 15
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=30 api
