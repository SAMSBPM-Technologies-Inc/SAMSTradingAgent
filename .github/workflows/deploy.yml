name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: CLOUDFLARE_TUNNEL_TOKEN,ENCRYPTION_KEY
          command_timeout: 30m
          script: |
            set -e
            cd /opt/trading-agent
            git pull origin main
            cd backend

            # Ensure env vars exist and are non-empty in .env.production.
            # Appends if the key is absent; overwrites if the key exists with an empty value.
            # This prevents pydantic from receiving "" and failing to parse bool/int/float.
            ENV=/opt/trading-agent/backend/.env.production
            set_if_missing_or_empty() {
              local key="$1" value="$2"
              if grep -q "^${key}=$" "$ENV" 2>/dev/null; then
                sed -i "s|^${key}=$|${key}=${value}|" "$ENV"
              elif ! grep -q "^${key}=" "$ENV" 2>/dev/null; then
                echo "${key}=${value}" >> "$ENV"
              fi
            }
            # Always overwrite secrets from GitHub Secrets (never leave stale/empty values)
            inject_secret() {
              local key="$1" value="$2"
              if grep -q "^${key}=" "$ENV" 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${value}|" "$ENV"
              else
                echo "${key}=${value}" >> "$ENV"
              fi
            }
            inject_secret CLOUDFLARE_TUNNEL_TOKEN "$CLOUDFLARE_TUNNEL_TOKEN"
            inject_secret ENCRYPTION_KEY          "$ENCRYPTION_KEY"

            set_if_missing_or_empty MONGODB_DB_NAME                trading_agent
            inject_secret           CORS_ORIGINS                   https://sta.samsbpm.com,https://samtrades.samsbpm.com
            set_if_missing_or_empty ANALYST_MODEL                  claude-opus-4-6
            set_if_missing_or_empty ANALYST_EXTENDED_THINKING      true
            set_if_missing_or_empty ANALYST_CACHE_MINUTES          60
            set_if_missing_or_empty ANALYST_PRICE_CHANGE_PCT       0.03
            set_if_missing_or_empty ANALYST_SCORE_CHANGE_THRESHOLD 0.12
            set_if_missing_or_empty ANALYST_VIX_SPIKE_THRESHOLD    30.0
            set_if_missing_or_empty AUTO_TRADE_ENABLED             false
            set_if_missing_or_empty AUTO_TRADE_LIVE_ALLOWED        false
            set_if_missing_or_empty IBKR_HOST                      127.0.0.1
            set_if_missing_or_empty IBKR_PORT                      4002
            set_if_missing_or_empty IBKR_CLIENT_ID                 1
            set_if_missing_or_empty ENABLE_ML_MODEL                false
            set_if_missing_or_empty ENABLE_BACKTESTING             false
            set_if_missing_or_empty ENABLE_AI_ANALYST              true
            set_if_missing_or_empty INGESTION_INTERVAL_MINUTES     5
            set_if_missing_or_empty WEIGHT_TECHNICAL               0.25
            set_if_missing_or_empty WEIGHT_FUNDAMENTAL             0.15
            set_if_missing_or_empty WEIGHT_SENTIMENT               0.20
            set_if_missing_or_empty WEIGHT_MACRO                   0.15
            set_if_missing_or_empty WEIGHT_VOLATILITY              0.10
            set_if_missing_or_empty WEIGHT_CATALYST                0.15

            docker compose -f docker-compose.prod.yml --env-file .env.production build api

            # Start api alone first so we can capture its logs if it crashes
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-deps api
            sleep 25

            # Always show api logs before checking health (helps diagnose crashes)
            echo "=== api logs ==="
            docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=50 api

            # Verify api is running before starting cloudflared
            docker compose -f docker-compose.prod.yml --env-file .env.production ps api
            docker inspect --format='{{.State.Status}} {{.State.Health.Status}}' trading_agent_api

            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --no-deps cloudflared
            sleep 5
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
