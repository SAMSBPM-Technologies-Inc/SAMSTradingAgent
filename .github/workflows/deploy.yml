name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Two pushes in quick succession previously produced two deploys racing over the
# same containers on the box — one removed trading_agent_api while the other was
# starting it ("container is marked for removal and cannot be started"), and the
# run that finished last decided the final state. Serialise instead.
# cancel-in-progress stays false: killing a deploy mid-run can leave the host
# with a stopped api container.
concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # REQUIRED: the TWS_* secrets and the TRADING_MODE / AUTO_TRADE_* variables
    # are scoped to the "Production" environment. GitHub only exposes
    # environment-scoped secrets to a job that declares the environment —
    # without this line every secrets.* and vars.* lookup below silently
    # resolves to an empty string and the gateway is skipped.
    environment: Production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          # Claude API key for the AI analyst. This was previously absent from
          # the workflow entirely, so the key could never reach the server no
          # matter what was configured in GitHub — ENABLE_AI_ANALYST=true while
          # analyst.py returned at its first guard, and every signal silently
          # fell back to rule-based.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Market-data providers. Absent from this workflow until now, so both
          # arrived empty on the server: news sentiment reported no_api_key and
          # the macro block stayed unpopulated.
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Fundamentals providers, replacing yfinance — which 429s from this
          # server's IP and leaves fundamental_score pinned at its 0.5 fallback.
          # Massive is Polygon.io rebranded, i.e. one of the licensed providers
          # CLAUDE.md names for production use.
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          # IB Gateway login — required for the ibgateway container to authenticate.
          # Without these IBC exits at startup and nothing listens on the API port.
          # IBKR issues SEPARATE credentials for paper and live; the deploy script
          # picks the pair matching TRADING_MODE and writes it as TWS_USERID/
          # TWS_PASSWORD, which are the env var names the gateway image expects.
          TWS_USERID_PAPER: ${{ secrets.TWS_USERID_PAPER }}
          TWS_PASSWORD_PAPER: ${{ secrets.TWS_PASSWORD_PAPER }}
          TWS_USERID: ${{ secrets.TWS_USERID }}
          TWS_PASSWORD: ${{ secrets.TWS_PASSWORD }}
          # "paper" or "live". Selects BOTH the credential pair and the socat
          # relay port. Defaults to paper — the safe direction to fail.
          TRADING_MODE: ${{ vars.TRADING_MODE || 'paper' }}
          # Master kill-switch. Must be "true" or the app never even attempts a
          # broker connection (see main.py lifespan / pipeline._execute_trades).
          AUTO_TRADE_ENABLED: ${{ vars.AUTO_TRADE_ENABLED || 'false' }}
          # Second, independent gate. Must ALSO be "true" for real-money orders:
          # without it PUT /trading/settings rejects paper_trading=false with 403.
          # TRADING_MODE=live alone is not sufficient.
          AUTO_TRADE_LIVE_ALLOWED: ${{ vars.AUTO_TRADE_LIVE_ALLOWED || 'false' }}
          # Which IBKR account to trade. REQUIRED when the login manages more
          # than one account (e.g. an individual account plus a registered one):
          # without it the adapter refuses to size positions or submit orders
          # rather than let IB pick an account for us.
          IBKR_ACCOUNT_ID: ${{ vars.IBKR_ACCOUNT_ID }}
          # Paper logins expose a different account (DU…), so the live account ID
          # must not leak into paper mode — the adapter would reject every order
          # with ibkr_unknown_account. Leave unset when the paper login manages
          # exactly one account; the adapter resolves it automatically then.
          IBKR_ACCOUNT_ID_PAPER: ${{ vars.IBKR_ACCOUNT_ID_PAPER }}
          # Classify on percentile within the watchlist rather than on an
          # absolute cutoff. Defaults to false — the safe direction, and the
          # same shape as the two AUTO_TRADE_* switches above: this decides
          # which names the agent buys, so an unset variable must not turn it
          # on. See services/cross_section.py.
          ENABLE_RANK_SIGNALS: ${{ vars.ENABLE_RANK_SIGNALS || 'false' }}
          # SMTP for trade-execution emails. Leaving SMTP_HOST unset disables
          # email entirely; trading is unaffected either way.
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # EXPLICIT ALLOWLIST. The env: block above only populates the runner's
          # own environment; ssh-action forwards to the remote shell nothing but
          # the names listed here. A variable set above and omitted here arrives
          # as an empty string, with no error from either side — which is how
          # ANTHROPIC_API_KEY reached the server blank. Add to BOTH places.
          envs: CLOUDFLARE_TUNNEL_TOKEN,ENCRYPTION_KEY,ANTHROPIC_API_KEY,FINNHUB_API_KEY,FRED_API_KEY,MASSIVE_API_KEY,ALPHAVANTAGE_API_KEY,TWS_USERID,TWS_PASSWORD,TWS_USERID_PAPER,TWS_PASSWORD_PAPER,TRADING_MODE,AUTO_TRADE_ENABLED,AUTO_TRADE_LIVE_ALLOWED,IBKR_ACCOUNT_ID,IBKR_ACCOUNT_ID_PAPER,ENABLE_RANK_SIGNALS,SMTP_HOST,SMTP_PORT,SMTP_FROM,SMTP_USERNAME,SMTP_PASSWORD
          command_timeout: 30m
          script: |
            set -e
            cd /opt/trading-agent
            git pull origin main
            cd backend

            # Ensure env vars exist and are non-empty in .env.production.
            # Appends if the key is absent; overwrites if the key exists with an empty value.
            # This prevents pydantic from receiving "" and failing to parse bool/int/float.
            ENV=/opt/trading-agent/backend/.env.production
            touch "$ENV"

            # Rewrite a key by dropping its line and appending the new one.
            #
            # Deliberately NOT sed. The previous implementation used
            # `sed "s|^KEY=.*|KEY=$value|"`, which breaks on any value
            # containing the delimiter — a Zoho app password with a "|" in it
            # failed the whole deploy with "unterminated `s' command", and
            # escaping for sed is easy to get subtly wrong for arbitrary
            # secrets. printf writes the value literally, whatever it contains.
            _set_key() {
              local key="$1" value="$2"
              grep -v "^${key}=" "$ENV" > "${ENV}.tmp" 2>/dev/null || true
              printf '%s=%s\n' "$key" "$value" >> "${ENV}.tmp"
              mv "${ENV}.tmp" "$ENV"
            }

            # Fill in a default only when the key is absent or empty, so a value
            # already tuned on the server is never clobbered by a deploy.
            # (Empty values matter: pydantic fails to parse "" as bool/int/float.)
            set_if_missing_or_empty() {
              local key="$1" value="$2"
              local current
              current=$(grep "^${key}=" "$ENV" 2>/dev/null | head -1 | cut -d= -f2-)
              if [ -z "$current" ]; then
                _set_key "$key" "$value"
              fi
            }

            # Always overwrite from GitHub Secrets (never leave stale/empty values)
            inject_secret() {
              _set_key "$1" "$2"
            }
            inject_secret CLOUDFLARE_TUNNEL_TOKEN "$CLOUDFLARE_TUNNEL_TOKEN"
            # Load-bearing as of 1.14.0: this is what makes users' stored
            # provider keys readable. It has always been injected from a
            # secret rather than generated on the box, which is the right
            # way round — the operator needs a copy, because rotating it
            # makes every stored key undecryptable. The chain then skips
            # them and falls through to the server key, so the symptom is
            # a silent loss of model choice rather than an outage.
            inject_secret ENCRYPTION_KEY          "$ENCRYPTION_KEY"

            # ── JWT signing key ───────────────────────────────────────────────
            # Never injected from GitHub Secrets: rotating it on every deploy
            # would invalidate every session. It is set once, by hand, and
            # persists in .env.production — which means "never set at all" also
            # persists, silently, because the app falls back to a placeholder
            # that is committed to this repo. Anyone who reads the source could
            # then forge a token for any user and reach order placement.
            #
            # Generated rather than failed on, so a fresh box comes up secure
            # instead of blocking the deploy. Only ever fills a missing or
            # placeholder value; a real key already in place is left alone.
            CURRENT_JWT=$(grep '^JWT_SECRET_KEY=' "$ENV" 2>/dev/null | head -1 | cut -d= -f2-)
            if [ -z "$CURRENT_JWT" ] || [ "$CURRENT_JWT" = "change-me-in-production" ]; then
              echo "::warning::JWT_SECRET_KEY was missing or still the placeholder — generating one. Existing sessions are invalidated; sign in again."
              _set_key JWT_SECRET_KEY "$(openssl rand -hex 32)"
            else
              echo "JWT_SECRET_KEY present (not the placeholder)"
            fi

            # ── IB Gateway credentials + mode ─────────────────────────────────
            # Credentials were previously never written to .env.production, so
            # the ibgateway container had no login and IBC exited immediately.
            #
            # Credential pair AND relay port are chosen in ONE branch so they can
            # never disagree — pointing live credentials at the paper port (or
            # vice versa) fails in confusing ways.
            #   paper -> TWS_USERID_PAPER / TWS_PASSWORD_PAPER, port 4004
            #   live  -> TWS_USERID       / TWS_PASSWORD,       port 4003
            # 4003/4004 are the socat relay ports. IB Gateway's own 4001/4002 are
            # bound to 127.0.0.1 inside the gateway container and are unreachable
            # from the api container.
            if [ "$TRADING_MODE" = "live" ]; then
              IB_USER="$TWS_USERID"
              IB_PASS="$TWS_PASSWORD"
              IB_PORT=4003
              IB_ACCT="$IBKR_ACCOUNT_ID"
              echo "════════════════════════════════════════════════════════════"
              echo "⚠️  TRADING_MODE=live — orders will hit the REAL account."
              echo "    AUTO_TRADE_ENABLED     = ${AUTO_TRADE_ENABLED:-false}"
              echo "    AUTO_TRADE_LIVE_ALLOWED= ${AUTO_TRADE_LIVE_ALLOWED:-false}"
              echo "    IBKR_ACCOUNT_ID        = ${IBKR_ACCOUNT_ID:-<unset>}"
              echo "    Real orders require BOTH flags true AND each user's"
              echo "    auto_trade_settings.paper_trading=false."
              echo "    IBKR_ACCOUNT_ID must be set when the login manages more"
              echo "    than one account, or orders and sizing are refused."
              if [ -z "$IBKR_ACCOUNT_ID" ]; then
                echo "    ⚠️  IBKR_ACCOUNT_ID is UNSET — trading will fail closed."
              fi
              echo "════════════════════════════════════════════════════════════"
            else
              IB_USER="$TWS_USERID_PAPER"
              IB_PASS="$TWS_PASSWORD_PAPER"
              IB_PORT=4004
              IB_ACCT="$IBKR_ACCOUNT_ID_PAPER"
              echo "TRADING_MODE=paper — using paper credentials, relay port 4004."
            fi

            inject_secret TWS_USERID   "$IB_USER"
            inject_secret TWS_PASSWORD "$IB_PASS"
            inject_secret IBKR_PORT    "$IB_PORT"
            inject_secret TRADING_MODE "$TRADING_MODE"
            inject_secret AUTO_TRADE_ENABLED "$AUTO_TRADE_ENABLED"
            inject_secret IBKR_ACCOUNT_ID   "$IB_ACCT"
            inject_secret SMTP_HOST     "$SMTP_HOST"
            inject_secret SMTP_PORT     "$SMTP_PORT"
            inject_secret SMTP_FROM     "$SMTP_FROM"
            inject_secret SMTP_USERNAME "$SMTP_USERNAME"
            inject_secret SMTP_PASSWORD "$SMTP_PASSWORD"

            set_if_missing_or_empty MONGODB_DB_NAME                trading_agent
            inject_secret           CORS_ORIGINS                   https://sta.samsbpm.com,https://samtrades.samsbpm.com
            # Injected, not set_if_missing: the first deploy wrote
            # claude-opus-4-6 here, and set_if_missing_or_empty only fills
            # blanks — so the model could never be changed by a later deploy,
            # the same trap described below for AUTO_TRADE_ENABLED. The whole
            # point of moving to Sonnet 5 was the output rate, which is where
            # this workload's cost lives.
            inject_secret           ANALYST_MODEL                  claude-sonnet-5
            inject_secret           ANALYST_EFFORT                 medium
            set_if_missing_or_empty ANALYST_EXTENDED_THINKING      true
            set_if_missing_or_empty ANALYST_CACHE_MINUTES          60
            set_if_missing_or_empty ANALYST_PRICE_CHANGE_PCT       0.03
            set_if_missing_or_empty ANALYST_SCORE_CHANGE_THRESHOLD 0.12
            set_if_missing_or_empty ANALYST_VIX_SPIKE_THRESHOLD    30.0
            # Gate: only call Claude within this margin of a BUY/SELL threshold,
            # or when a position is open. Injected so the values stay tunable
            # from here rather than freezing on whatever the first deploy wrote.
            inject_secret           ANALYST_GATE_ENABLED           true
            inject_secret           ANALYST_GATE_MARGIN            0.08
            inject_secret           ANALYST_ALWAYS_ANALYSE_HOLDINGS true
            # AUTO_TRADE_ENABLED / IBKR_PORT are injected above (not set_if_missing).
            # set_if_missing_or_empty only fills blanks, so the old `false` written
            # on the first deploy could never be flipped on by a later deploy.
            # IBKR_HOST is set by docker-compose (=ibgateway) and needs no default here.
            # Injected, not set_if_missing: the latter wrote `false` on the first
            # deploy and could never flip it afterwards, so live trading stayed
            # blocked at the API layer (403 on paper_trading=false) no matter what
            # TRADING_MODE said. Same defect that kept AUTO_TRADE_ENABLED pinned off.
            inject_secret AUTO_TRADE_LIVE_ALLOWED "$AUTO_TRADE_LIVE_ALLOWED"
            set_if_missing_or_empty IBKR_CLIENT_ID                 1
            set_if_missing_or_empty ENABLE_ML_MODEL                false
            set_if_missing_or_empty ENABLE_BACKTESTING             false
            set_if_missing_or_empty ENABLE_AI_ANALYST              true

            # ── Relative scoring ──────────────────────────────────────────────
            # Injected, never set_if_missing, and the distinction is the whole
            # reason this line exists: seeding it would write `false` on the
            # first deploy and then skip the key forever, so setting the GitHub
            # variable to `true` would look like an enablement and do nothing.
            # That is the trap this file already records for ANALYST_MODEL,
            # AUTO_TRADE_ENABLED and AUTO_TRADE_LIVE_ALLOWED.
            #
            # Unlike those three it is driven by `vars.` rather than hardcoded
            # here, because it is an experiment the operator turns on and off
            # while watching /performance/calibration — not a setting that
            # should need a commit to change. An unset variable resolves to
            # `false` in the env: block above, so the safe direction survives
            # both a missing variable and a missing envs: entry.
            inject_secret ENABLE_RANK_SIGNALS "$ENABLE_RANK_SIGNALS"
            echo "ENABLE_RANK_SIGNALS=$ENABLE_RANK_SIGNALS (verdicts are $([ "$ENABLE_RANK_SIGNALS" = "true" ] && echo 'ranked against the watchlist' || echo 'on the absolute rule'))"

            # ── Deep research (agent orchestrator) ────────────────────────────
            # Split deliberately between the two helpers, applying the lesson
            # this file already records three times above:
            #
            #   set_if_missing_or_empty  seeds a value once and then never
            #                            touches it again — right for a switch
            #                            the operator owns on the box.
            #   inject_secret            overwrites every deploy — right for
            #                            anything that must stay changeable from
            #                            here, which is how ANALYST_MODEL ended
            #                            up frozen at claude-opus-4-6.
            #
            # The two enable flags were seeded once and then left to the box, on
            # a rollout plan of turning them on by hand while watching. They are
            # injected now, which reverses that deliberately: the flags are
            # version-controlled and reviewable here, and `set_if_missing_or_empty`
            # could never have switched them ON anyway — it skips any key that is
            # already present and non-empty, so a box seeded false on its first
            # deploy stays false however the default here is edited. Changing the
            # value below without changing the helper would have looked like an
            # enablement and done nothing.
            #
            # AGENTS_ENABLED only costs money and produces dossiers. It reaches
            # no order path: research can veto a BUY and can never create,
            # enlarge, or exit one.
            inject_secret           RESEARCH_AGENTS_ENABLED        true
            # VETO_ENABLED is the one that moves money, and it refuses a
            # *manually placed* order too — it sits in `_prepare_entry` with the
            # shared guard chain, not in the agent's own selection path. Its
            # floor of 35 was chosen the way BUY_THRESHOLD = 0.70 was chosen,
            # by picking one, and until `GET /performance/research-calibration`
            # has graded dossiers there is no evidence it is right.
            #
            # So it runs as a dry run instead, which needed no extra machinery:
            # with agents on and this off, every dossier still computes and
            # reports `would_block` — the same judgement, without the refusal.
            # That accumulates exactly the evidence the counterfactual needs.
            #
            # Flip to true once `veto_counterfactual` on
            # /performance/research-calibration says `conclusive: true` AND a
            # positive `alpha_saved` — i.e. the names it would have refused
            # actually did worse. Roughly three weeks of dossiers. Turning it on
            # before then is guessing with extra steps, and the thing being
            # guessed with is entry refusals on hand-placed orders.
            inject_secret           RESEARCH_VETO_ENABLED          false

            # ── Rebuttal, memory, stances and sentiment breadth ───────────────
            # One rebuttal exchange is on by default: two extra orchestrator
            # calls per dossier, and the step that changes the verdict. The
            # stance panel and both sentiment sources are off — advisory or
            # evidence-only, and each is more calls for a reading nothing acts
            # on yet.
            inject_secret           RESEARCH_DEBATE_ROUNDS         1
            inject_secret           RESEARCH_OUTCOME_HORIZON_DAYS  20
            inject_secret           RESEARCH_MEMORY_SAME_TICKER    5
            inject_secret           RESEARCH_MEMORY_CROSS_TICKER   3
            inject_secret           RESEARCH_STANCE_PANEL_ENABLED  false
            inject_secret           SOCIAL_SENTIMENT_ENABLED       false
            inject_secret           PREDICTION_MARKETS_ENABLED     false
            # What every realised return is measured against. Nothing in the
            # engine had a benchmark before this; a +6% signal in a +8% market
            # was recorded as a win.
            inject_secret           BENCHMARK_TICKER               SPY


            # Everything below stays injected so it never freezes on whatever
            # the first deploy happened to write. Model ids especially: these
            # will outlive Opus 5, and a model change should not require SSH.
            inject_secret           RESEARCH_ORCHESTRATOR_MODEL    claude-opus-5
            inject_secret           RESEARCH_SPECIALIST_MODEL      claude-sonnet-5
            inject_secret           RESEARCH_EFFORT                high
            inject_secret           RESEARCH_DOSSIER_TTL_HOURS     24
            inject_secret           RESEARCH_DAILY_REFRESH_HOUR    6
            # Veto thresholds gate money, so they follow the ANALYST_GATE_*
            # precedent and stay tunable from here rather than from the box.
            inject_secret           RESEARCH_VETO_MIN_CONVICTION   35
            inject_secret           RESEARCH_VETO_MAX_AGE_HOURS    48

            # Earnings history moves quarterly, so it is cached for a week — the
            # Alpha Vantage budget covers OVERVIEW and EARNINGS between them and
            # cannot do both for every ticker daily. Operational rather than
            # central, so seeded and then left to the box.
            set_if_missing_or_empty ALPHAVANTAGE_EARNINGS_CACHE_DAYS 7
            set_if_missing_or_empty ALPHAVANTAGE_EARNINGS_EAGER_DAYS 7

            # ── Third-party API keys ──────────────────────────────────────────
            # Guarded rather than injected straight through. inject_secret always
            # overwrites, so a missing secret — or one merely absent from the
            # ssh-action envs: allowlist — resolves to "" and would blank a
            # working key. Every consumer here treats a missing key as "feature
            # off" and degrades silently, so a blanked key produces no error
            # anywhere: the analyst stops running, sentiment falls back to
            # no_api_key, macro goes empty. An empty value is far more likely to
            # mean the secret never reached this script than that someone meant
            # to clear it, so never overwrite a good value with a blank.
            inject_key_guarded() {
              local key="$1" value="$2" consequence="$3"
              if [ -n "$value" ]; then
                inject_secret "$key" "$value"
                # Length only, never the value — enough to confirm it arrived.
                echo "$key injected (${#value} chars)"
                return
              fi
              echo "WARNING: $key resolved empty on the server."
              echo "  Check, in order:"
              echo "   1. $key is listed in the ssh-action 'envs:' allowlist."
              echo "      Setting it in the job's env: block alone is NOT enough —"
              echo "      anything absent from envs: arrives blank."
              echo "   2. The secret exists and is scoped to the Production"
              echo "      environment (gh secret list --env Production)."
              if [ -n "$(grep "^${key}=" "$ENV" 2>/dev/null | cut -d= -f2-)" ]; then
                echo "  Existing value on the server left untouched."
              else
                echo "  No value on the server either — $consequence"
              fi
            }

            inject_key_guarded ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY" \
              "the AI analyst stays disabled and every signal falls back to rule-based."
            # Finnhub drives news sentiment; FRED drives the macro block. Both
            # were absent from this workflow entirely, so neither could ever
            # reach the server. The cost is not an outage but a silently
            # degraded score: sentiment_score collapses to a narrow band and
            # macro_score to a constant, which flattens the composite and can
            # leave the BUY threshold effectively unreachable.
            inject_key_guarded FINNHUB_API_KEY "$FINNHUB_API_KEY" \
              "news sentiment will read no_api_key and sentiment_score goes flat."
            inject_key_guarded FRED_API_KEY "$FRED_API_KEY" \
              "macro data will be empty and macro_score becomes a constant."
            inject_key_guarded MASSIVE_API_KEY "$MASSIVE_API_KEY" \
              "fundamentals fall back to yfinance, which rate-limits from this host."
            inject_key_guarded ALPHAVANTAGE_API_KEY "$ALPHAVANTAGE_API_KEY" \
              "the secondary fundamentals source is unavailable."
            set_if_missing_or_empty INGESTION_INTERVAL_MINUTES     5

            # ── Scoring weights: written every deploy, not set-if-missing ─────
            # These are a model decision that belongs to the code, not an
            # operator setting. Under set_if_missing_or_empty the first deploy
            # pinned them into .env.production and no later change could ever
            # reach the box — rebalancing the model in config.py would build a
            # new image that then read the old weights from disk and behave
            # exactly as before, silently. Same defect the file already carries
            # scars from with AUTO_TRADE_LIVE_ALLOWED and AUTO_TRADE_ENABLED.
            #
            # Values must match the Settings defaults in backend/app/config.py
            # and sum to 1.0, or the API refuses to start (validate_weights_sum).
            # WEIGHT_VOLATILITY is 0.0 deliberately: volatility is priced at the
            # risk gate, and scoring it again double-counted it.
            #
            # Per-user tuning is unaffected — that lives in users.scoring_weights.
            inject_secret WEIGHT_TECHNICAL               0.30
            inject_secret WEIGHT_FUNDAMENTAL             0.20
            inject_secret WEIGHT_SENTIMENT               0.20
            inject_secret WEIGHT_MACRO                   0.15
            inject_secret WEIGHT_VOLATILITY              0.00
            inject_secret WEIGHT_CATALYST                0.15

            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.production"

            $COMPOSE build api

            # ── IB Gateway ────────────────────────────────────────────────────
            # This service was previously NEVER started by this workflow (every
            # `up` used --no-deps and named only api/cloudflared), so unless it
            # had been launched by hand on the box there was no gateway at all.
            # Checks the credentials actually selected for this mode, not the
            # live pair — otherwise a paper deploy with only paper secrets set
            # would skip the gateway.
            GATEWAY_STARTED=0
            if [ -n "$IB_USER" ] && [ -n "$IB_PASS" ]; then
              echo "=== starting ibgateway (mode=$TRADING_MODE, port=$IB_PORT) ==="
              $COMPOSE up -d --no-deps ibgateway
              GATEWAY_STARTED=1
            else
              if [ "$TRADING_MODE" = "live" ]; then
                echo "WARNING: TWS_USERID/TWS_PASSWORD not set — skipping ibgateway."
              else
                echo "WARNING: TWS_USERID_PAPER/TWS_PASSWORD_PAPER not set — skipping ibgateway."
              fi
              echo "         Auto-trading will stay disconnected until they are configured."
            fi

            # Start api alone first so we can capture its logs if it crashes
            $COMPOSE up -d --no-deps api
            sleep 25

            # Always show api logs before checking health (helps diagnose crashes)
            echo "=== api logs ==="
            $COMPOSE logs --tail=50 api

            # Verify api is running before starting cloudflared
            $COMPOSE ps api
            docker inspect --format='{{.State.Status}} {{.State.Health.Status}}' trading_agent_api

            $COMPOSE up -d --no-deps cloudflared
            sleep 5
            $COMPOSE ps

            # ── IB Gateway login diagnostics ──────────────────────────────────
            # IBC's own output is the only place a failed login is visible —
            # notably a live 2FA push that nobody answered, which otherwise just
            # looks like a gateway that never starts serving.
            if [ "$GATEWAY_STARTED" = "1" ]; then
              echo "=== waiting for IBC login (~120s) ==="
              sleep 90
              echo "=== ibgateway logs ==="
              $COMPOSE logs --tail=60 ibgateway 2>&1 \
                | grep -viE 'password|userid|username' || true
              echo "=== ibgateway container state ==="
              docker inspect --format='{{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' trading_ibgateway || true
            fi

            # ── Broker reachability probe ─────────────────────────────────────
            # Proves the api container can actually open a socket to the gateway
            # relay port. Runs whenever the gateway was started — not only when
            # auto-trading is armed — since it is the cheapest proof that the
            # port/credentials/mode combination is right.
            # Non-fatal: IB Gateway needs ~120s to finish IBC login.
            if [ "$GATEWAY_STARTED" = "1" ]; then
              echo "=== IBKR reachability (api -> ibgateway:${TRADING_MODE}) ==="
              # Keep this a single line — a multi-line -c would break the YAML block scalar.
              # The api image is python:3.12-slim and has no nc, so use socket directly.
              if docker exec trading_agent_api python -c "import os,socket; socket.create_connection((os.getenv('IBKR_HOST','ibgateway'), int(os.getenv('IBKR_PORT','4004'))), 5).close()"; then
                echo "OK: api reached the IB Gateway relay port"
              else
                echo "NOT READY: api cannot reach the gateway relay port yet."
                echo "  Expected if the deploy just ran (IBC login takes ~120s) — broker.py retries."
                echo "  If it persists: docker compose -f docker-compose.prod.yml logs ibgateway"
              fi
            fi
