name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # REQUIRED: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are scoped to the
    # "Production" environment. GitHub only exposes environment-scoped secrets to
    # a job that declares the environment — without this line both resolve to an
    # empty string and wrangler fails with "it's necessary to set a
    # CLOUDFLARE_API_TOKEN environment variable". Same omission previously broke
    # the backend deploy (see deploy.yml).
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # REQUIRED. Vite inlines this at BUILD time, so it must be present in
          # CI — it cannot be supplied later. src/lib/api.ts falls back to
          # http://localhost:8000 when it is unset, which produces a build that
          # looks fine but cannot reach the API at all: login and every
          # authenticated request fail against the user's own machine.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.samsbpm.com' }}

      # Guard: a bundle pointing at localhost is worse than a failed deploy,
      # because it replaces a working site with a broken one. Fail here instead.
      - name: Verify API base URL was inlined
        working-directory: frontend
        run: |
          if grep -rqF "localhost:8000" dist/assets/*.js; then
            echo "::error::Build inlined http://localhost:8000 as the API base URL."
            echo "VITE_API_BASE_URL was not set at build time. Refusing to deploy."
            exit 1
          fi
          echo "OK: no localhost API URL in the bundle."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=samstradingagent --branch=main
          workingDirectory: frontend
